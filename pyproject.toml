[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-video"
version = "0.1.0"
description = "Deep video understanding for Claude Code — shot-aware, cross-modal, beyond uniform frame sampling."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "cc-video" }]
keywords = ["video", "claude", "llm", "multimodal", "asr", "ocr"]

dependencies = [
    "scenedetect[opencv]>=0.6.4",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0", "pyannote.audio>=3.1"]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
vlm = ["google-genai>=0.3"]
clip = ["torch>=2.1", "open-clip-torch>=2.24", "scikit-learn>=1.3"]
all = [
    "faster-whisper>=1.0", "pyannote.audio>=3.1",
    "paddleocr>=2.7", "paddlepaddle>=2.6",
    "google-genai>=0.3",
    "torch>=2.1", "open-clip-torch>=2.24", "scikit-learn>=1.3",
]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
cc-video = "cc_video.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_video"]

[tool.ruff]
line-length = 100
target-version = "py310"
